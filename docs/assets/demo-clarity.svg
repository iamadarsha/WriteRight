<svg width="820" height="302" viewBox="0 0 820 302" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Arial,sans-serif">
  <title>WriteRight flags a hard-to-read sentence and offers a tighter version — computed on your device</title>
  <defs>
    <filter id="cl-sh" x="-15%" y="-15%" width="130%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b1b3a" flood-opacity="0.14"/></filter>
    <filter id="cl-pop" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1b3a" flood-opacity="0.18"/></filter>
  </defs>

  <rect x="10" y="8" width="800" height="286" rx="18" fill="#ffffff" stroke="#e7e8ee" filter="url(#cl-sh)"/>
  <rect x="10" y="8" width="800" height="44" rx="18" fill="#f7f8fb"/><rect x="10" y="38" width="800" height="14" fill="#f7f8fb"/>
  <circle cx="34" cy="30" r="5.5" fill="#ff5f57"/><circle cx="52" cy="30" r="5.5" fill="#febc2e"/><circle cx="70" cy="30" r="5.5" fill="#28c840"/>
  <text x="92" y="34" font-size="12" fill="#8a8a92">Notes · draft</text>
  <g transform="translate(660 20)"><rect width="140" height="22" rx="11" fill="#eaf4f9"/><circle cx="13" cy="11" r="4.5" fill="#1a86b8"/><text x="24" y="15" font-size="11" fill="#256b85">Clarity check · on</text></g>

  <!-- paragraph -->
  <g font-size="16" fill="#33333a">
    <text x="38" y="96">Because the previous vendor was unable to deliver on time, and</text>
    <text x="38" y="124">given that our timeline had already slipped twice, we decided it</text>
    <text x="38" y="152">would be best to move forward with a different supplier.</text>
  </g>
  <!-- blue clarity underline sweeps across all three lines -->
  <g fill="#1a86b8">
    <rect x="38" y="102" width="0" height="3" rx="1.5"><animate attributeName="width" dur="11s" repeatCount="indefinite" keyTimes="0;0.10;0.20;0.66;0.70;1" values="0;0;560;560;0;0" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1;0 0 1 1;0.6 0 0.4 1;0 0 1 1"/></rect>
    <rect x="38" y="130" width="548" height="3" rx="1.5" opacity="0"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" keyTimes="0;0.20;0.22;0.66;0.70;1" values="0;0;1;1;0;0"/></rect>
    <rect x="38" y="158" width="470" height="3" rx="1.5" opacity="0"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" keyTimes="0;0.20;0.22;0.66;0.70;1" values="0;0;1;1;0;0"/></rect>
  </g>

  <!-- clarity card -->
  <g opacity="0" filter="url(#cl-pop)">
    <animate attributeName="opacity" dur="11s" repeatCount="indefinite" keyTimes="0;0.26;0.32;0.90;0.95;1" values="0;0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="11s" repeatCount="indefinite" keyTimes="0;0.26;0.32;1" values="38 194;38 194;38 180;38 180" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1;0 0 1 1"/>
    <rect x="0" y="0" width="744" height="104" rx="14" fill="#ffffff" stroke="#e7e8ee"/>
    <circle cx="22" cy="26" r="5" fill="#1a86b8"/>
    <text x="34" y="30" font-size="11.5" font-weight="700" fill="#1a86b8" letter-spacing="0.4">CLARITY</text>
    <path d="M726 21 l-10 10 M716 21 l10 10" stroke="#c2c2ca" stroke-width="1.5" stroke-linecap="round"/>
    <text x="22" y="54" font-size="13" fill="#3a3a42">This 26-word sentence packs three ideas — try splitting it.</text>

    <rect x="22" y="64" width="700" height="28" rx="8" fill="#f1f8fb"/>
    <!-- typing dots then the rewrite -->
    <g opacity="1"><animate attributeName="opacity" dur="11s" repeatCount="indefinite" keyTimes="0;0.44;0.48;1" values="1;1;0;0"/>
      <circle cx="40" cy="78" r="3" fill="#9cc7d8"><animate attributeName="r" dur="0.9s" repeatCount="indefinite" values="3;4.5;3"/></circle>
      <circle cx="54" cy="78" r="3" fill="#9cc7d8"><animate attributeName="r" dur="0.9s" begin="0.15s" repeatCount="indefinite" values="3;4.5;3"/></circle>
      <circle cx="68" cy="78" r="3" fill="#9cc7d8"><animate attributeName="r" dur="0.9s" begin="0.3s" repeatCount="indefinite" values="3;4.5;3"/></circle>
      <text x="84" y="82" font-size="11.5" fill="#6a94a5">Rewriting on your device…</text>
    </g>
    <text x="34" y="82" font-size="12.5" fill="#1f627c" opacity="0" xml:space="preserve">The last vendor missed deadlines twice, so we chose a new supplier.<animate attributeName="opacity" dur="11s" repeatCount="indefinite" keyTimes="0;0.48;0.54;0.9;0.94;1" values="0;0;1;1;0;0"/></text>
  </g>

  <!-- accept pill -->
  <g opacity="0" transform="translate(586 214)">
    <animate attributeName="opacity" dur="11s" repeatCount="indefinite" keyTimes="0;0.56;0.6;0.86;0.9;1" values="0;0;1;1;0;0"/>
    <rect width="160" height="28" rx="8" fill="#1a86b8"/>
    <path d="M18 14 l4 4 l7 -9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="18" font-size="12" font-weight="600" fill="#fff">Use this sentence</text>
  </g>
</svg>
