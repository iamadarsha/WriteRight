<svg width="920" height="450" viewBox="0 0 920 450" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Arial,sans-serif">
  <title>WriteRight architecture: every analysis path stays on your device; the cloud is never in the loop</title>
  <defs>
    <filter id="a-sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0b1b3a" flood-opacity="0.11"/></filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6a7690"/></marker>
    <marker id="arwT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#12a3a0"/></marker>
  </defs>

  <rect x="3" y="3" width="914" height="444" rx="18" fill="#ffffff" stroke="#e7e8ee"/>
  <text x="30" y="36" font-size="15" font-weight="700" fill="#2a2a30">How WriteRight runs</text>

  <!-- cloud, outside, blocked -->
  <g opacity="0.95">
    <rect x="686" y="16" width="204" height="52" rx="12" fill="#f3f4f8" stroke="#dcdee5"/>
    <path d="M712 44 a8 8 0 0 1 2 -15 a11 11 0 0 1 20 -3 a8 8 0 0 1 4 18 z" fill="#d7d9e0"/>
    <text x="748" y="38" font-size="13" font-weight="700" fill="#8b8b95">Cloud / SaaS server</text>
    <text x="712" y="58" font-size="10.5" fill="#a9a9b2">grammar API · telemetry · account</text>
  </g>
  <path d="M690 74 V92" stroke="#d1453b" stroke-width="2" stroke-dasharray="4 5" fill="none"/>
  <g transform="translate(690 82)">
    <circle r="12" fill="#fdeceb" stroke="#d1453b" stroke-width="2"/>
    <line x1="-5.5" y1="-5.5" x2="5.5" y2="5.5" stroke="#d1453b" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <text x="356" y="60" font-size="12" font-weight="700" fill="#c2443b">No upload · no telemetry · no remote code · no account</text>

  <!-- device boundary -->
  <rect x="26" y="92" width="868" height="330" rx="16" fill="#f7fafc" stroke="#c9dbe6" stroke-dasharray="2 6"/>
  <rect x="42" y="80" width="132" height="24" rx="12" fill="#e6f1f6"/>
  <rect x="57" y="87" width="11" height="9" rx="2" fill="none" stroke="#1a6b86" stroke-width="1.6"/>
  <path d="M59 87 v-2 a3 3 0 0 1 6 0 v2" fill="none" stroke="#1a6b86" stroke-width="1.6"/>
  <text x="76" y="96" font-size="12" font-weight="700" fill="#1a6b86">Your device</text>

  <!-- any web page -->
  <g filter="url(#a-sh)"><rect x="52" y="150" width="188" height="184" rx="12" fill="#ffffff" stroke="#e7e8ee"/></g>
  <text x="70" y="178" font-size="13" font-weight="700" fill="#33333a">Any web page</text>
  <rect x="70" y="190" width="152" height="30" rx="6" fill="#f2f4f8"/><text x="80" y="209" font-size="11" fill="#8a8a92">&lt;textarea&gt;</text>
  <rect x="70" y="226" width="152" height="30" rx="6" fill="#f2f4f8"/><text x="80" y="245" font-size="11" fill="#8a8a92">contenteditable</text>
  <rect x="70" y="262" width="152" height="30" rx="6" fill="#f2f4f8"/><text x="80" y="281" font-size="11" fill="#8a8a92">&lt;input type=text&gt;</text>
  <rect x="70" y="298" width="152" height="26" rx="6" fill="#fdeceb"/><text x="80" y="315" font-size="10.5" fill="#c2443b">password — never read</text>

  <!-- content script -->
  <g filter="url(#a-sh)"><rect x="320" y="126" width="248" height="232" rx="12" fill="#ffffff" stroke="#e7e8ee"/></g>
  <text x="340" y="154" font-size="13" font-weight="700" fill="#33333a">Content script</text>
  <text x="340" y="171" font-size="10" fill="#9a9aa2">closed Shadow DOM · no page-CSS leak</text>
  <rect x="340" y="182" width="208" height="34" rx="7" fill="#eef4ff"/><text x="352" y="203" font-size="11.5" fill="#2b5da8">Inline underlines + popover</text>
  <rect x="340" y="222" width="208" height="34" rx="7" fill="#eef4ff"/><text x="352" y="243" font-size="11.5" fill="#2b5da8">Universal sidebar + writing score</text>
  <rect x="340" y="262" width="208" height="34" rx="7" fill="#eef7f2"/><text x="352" y="283" font-size="11.5" fill="#1f7a4d">Select-to-define pill</text>
  <rect x="340" y="302" width="208" height="34" rx="7" fill="#f4f0ff"/><text x="352" y="323" font-size="11.5" fill="#5b4bbd">Version-safe apply gate</text>

  <!-- background worker -->
  <g filter="url(#a-sh)"><rect x="648" y="126" width="228" height="150" rx="12" fill="#ffffff" stroke="#e7e8ee"/></g>
  <text x="666" y="154" font-size="13" font-weight="700" fill="#33333a">Background worker</text>
  <rect x="666" y="166" width="192" height="44" rx="8" fill="#eaf2ff"/>
  <text x="678" y="184" font-size="11.5" font-weight="700" fill="#0a58cc">Harper engine</text>
  <text x="678" y="199" font-size="10" fill="#5a7db0">WebAssembly · spelling + grammar</text>
  <rect x="666" y="216" width="192" height="44" rx="8" fill="#e7f5f2"/>
  <text x="678" y="234" font-size="11.5" font-weight="700" fill="#0c7d7a">Open English WordNet</text>
  <text x="678" y="249" font-size="10" fill="#3f8f8d">152k words · loads on first use</text>

  <!-- optional local AI -->
  <g filter="url(#a-sh)"><rect x="648" y="292" width="228" height="90" rx="12" fill="#ffffff" stroke="#ddd8f4"/></g>
  <text x="666" y="318" font-size="12.5" font-weight="700" fill="#5b4bbd">Local AI — optional, off by default</text>
  <text x="666" y="337" font-size="10" fill="#8a83c0">Chrome on-device · Ollama · LM Studio</text>
  <text x="666" y="354" font-size="10" fill="#8a83c0">reached on 127.0.0.1 only · CI-enforced</text>

  <!-- connections -->
  <path d="M240 242 H316" stroke="#6a7690" stroke-width="1.6" marker-end="url(#arw)" marker-start="url(#arw)"/>
  <text x="250" y="234" font-size="9.5" fill="#8a8a92">read text</text>
  <path d="M568 208 H644" stroke="#6a7690" stroke-width="1.6" marker-end="url(#arw)" marker-start="url(#arw)"/>
  <text x="576" y="200" font-size="9.5" fill="#8a8a92">analyze</text>
  <path d="M762 276 V292" stroke="#12a3a0" stroke-width="1.6" marker-end="url(#arwT)" marker-start="url(#arwT)"/>
  <text x="770" y="288" font-size="9.5" fill="#12a3a0">loopback</text>

  <text x="30" y="438" font-size="10.5" fill="#a2a2aa">Every default path ends inside the dashed box. The cloud is never contacted — there is no WriteRight account to have.</text>
</svg>
